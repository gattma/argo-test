apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: instances
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: argocd
    server: 'https://kubernetes.default.svc'
  project: "default"
  source:
    path: argocd/instances/
    repoURL: "https://github.com/gattma/argo-test.git"
    targetRevision: feature/app-config-test
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true